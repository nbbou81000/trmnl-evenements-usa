- keyname: type_evenement
  field_type: select
  name: Event Type
  description: Filter which events are shown on screen
  options:
  - "All: all"
  - "Music: music"
  - "Sports: sports"
  - "Arts & Theater: arts"
  - "Film: film"
  - "Other: misc"
  default: "all"

- keyname: about
  name: About this plugin
  field_type: author_bio
  category: events,music
  description: Nearby concerts and events across the USA, with date, price and type — powered by the Ticketmaster Discovery API, updated daily.
  github_url: https://github.com/nbbou81000/trmnl-evenements-usa
