name: Update events

on:
  schedule:
    - cron: "0 9 * * *"   # tous les jours à 9h UTC (~11h en France l'hiver)
  workflow_dispatch: {}   # ajoute un bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les événements (Ticketmaster)
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/fetch-events.js

      - name: Publier les JSON mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Mise à jour quotidienne des événements"
          git push
